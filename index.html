tween}.avatar{width:48px;height:48px;flex:none;border-radius:50%;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.field{width:100%;background:#0c0913;border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--text);margin:7px 0 12px}.composer textarea{min-height:105px;resize:vertical}.post{padding:20px;margin:14px 0}.postmedia{width:100%;max-height:560px;object-fit:contain;border-radius:15px;margin-top:12px;background:#07060a}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pill{border:1px solid var(--line);border-radius:99px;padding:6px 10px;color:var(--muted);font-size:12px}.profilecover{height:170px;background:linear-gradient(120deg,#512080,#161629);border-radius:18px;overflow:hidden}.profilecover img{width:100%;height:100%;object-fit:cover}.profilehead{display:flex;gap:16px;align-items:end;margin:-42px 0 15px 18px}.profilehead .avatar{width:92px;height:92px;border:4px solid #151121}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.adminwrap{display:grid;grid-template-columns:220px 1fr;gap:18px}.adminnav{background:#0c0a12;border:1px solid var(--line);padding:12px;border-radius:20px}.adminnav button{display:block;width:100%;text-align:left;margin:5px 0}.admincontent{min-width:0}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:12px;border-bottom:1px solid var(--line);text-align:left}.auth{max-width:470px;margin:8vh auto;padding:28px}.tag{color:#d8aaff;font-size:12px;letter-spacing:2px;font-weight:800}.mobilebar{display:none}@media(max-width:850px){.app{padding:14px}.layout{grid-template-columns:1fr}.side{position:static}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;padding:10px 4px;font-size:12px}.grid{grid-template-columns:repeat(2,1fr)}.adminwrap{grid-template-columns:1fr}.adminnav{display:grid;grid-template-columns:repeat(2,1fr)}.adminnav button{font-size:12px}.top{align-items:flex-start}}@media(max-width:480px){.grid{grid-template-columns:1fr}.hero{padding:20px}.panel,.post{padding:15px}.app{padding:10px}}
</style></head><body><div id="auth" class="auth"><div class="brand"><div class="logo">V</div><div>VYLOOP SOCIAL<div class="muted" style="font-size:10px;letter-spacing:3px">YOUR WORLD. YOUR LOOP.</div></div></div><h2 id="authTitle">Welcome back</h2><p class="muted">Connect, create and share.</p><div id="signupFields" class="hidden"><input id="display" class="field" placeholder="Display name"><input id="username" class="field" placeholder="Username"><label class="muted">Date of birth (18+)</label><input id="dob" type="date" class="field"></div><input id="email" type="email" class="field" placeholder="Email"><input id="password" type="password" class="field" placeholder="Password"><button class="primary" style="width:100%" id="authGo">Log in</button><p class="muted" id="authMsg"></p><button id="authSwitch">Create account</button></div>
<div id="app" class="app hidden"><header class="top"><div class="brand"><div class="logo">V</div><div>VYLOOP SOCIAL<div class="muted" style="font-size:10px;letter-spacing:3px">YOUR WORLD. YOUR LOOP.</div></div></div><div class="row"><span id="who" class="muted"></span><button id="logout">Log out ↗</button></div></header><div class="layout"><aside class="side"><div class="row" style="margin:5px 4px 18px"><div class="avatar" id="sideAvatar">V</div><div><b id="sideName">Your loop</b><div class="muted" id="sideHandle"></div></div></div><nav class="nav" id="nav"><button data-page="feed" class="active">⌂ Home feed</button><button data-page="discover">◎ Discover</button><button data-page="reels">▷ Videos</button><button data-page="communities">♧ Communities</button><button data-page="market">▦ Marketplace</button><button data-page="messages">✉ Messages</button><button data-page="notifications">♢ Notifications</button><button data-page="profile">◉ My profile</button><button data-page="settings">⚙ Settings</button><button data-page="admin" id="adminNav" class="hidden">▤ Admin Control Hub</button></nav><p class="muted" style="font-size:12px;margin:22px 5px">Be kind. Keep it real.</p></aside><main class="main"><section class="hero"><div class="tag">WELCOME TO YOUR COMMUNITY</div><h1 id="pageTitle">Your loop</h1><div class="muted">Your world. Your loop. Connect with people and share what matters.</div></section><div id="view"></div></main></div></div>
<script>
const SUPABASE_URL='https://nsuacflxwjwdrpmmdsbd.supabase.co';const SUPABASE_KEY='sb_publishable_K1oYaIddM8_KnI4umSL3hw_BXmfQ-Fd';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null,me=null,adminRoles=[],page='feed',selectedProfile=null,posts=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initials=s=>(s||'V').trim().slice(0,1).toUpperCase();const avatar=(p,size='')=>'<div class="avatar '+size+'">'+(p?.avatar_url?'<img src="'+esc(p.avatar_url)+'">':initials(p?.display_name||p?.username))+'</div>';
function notice(msg){alert(msg)}async function loadMe(){const {data}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();me=data;const {data:roles}=await db.from('admin_assignments').select('is_active,admin_roles(role_key,label)').eq('user_id',user.id).eq('is_active',true);adminRoles=(roles||[]).map(x=>x.admin_roles?.role_key).filter(Boolean);$('adminNav').classList.toggle('hidden',!adminRoles.length);$('who').textContent=me?.display_name||user.email;$('sideName').textContent=me?.display_name||'Your loop';$('sideHandle').textContent='@'+(me?.username||'');$('sideAvatar').innerHTML=me?.avatar_url?'<img src="'+esc(me.avatar_url)+'">':initials(me?.display_name); }
async function upload(file,folder){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=user.id+'/'+folder+'/'+crypto.randomUUID()+'.'+ext;const {error}=await db.storage.from('media').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;const {data}=db.storage.from('media').getPublicUrl(path);return data.publicUrl}
function go(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
$('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
async function render(){const titles={feed:'Your loop',discover:'Discover people',reels:'VYLOOP videos',communities:'Communities',market:'Marketplace',messages:'Messages',notifications:'Notifications',profile:'My profile',settings:'Settings',admin:'Admin Control Hub'};$('pageTitle').textContent=titles[page]||'Your loop';const v=$('view');if(page==='feed'){v.innerHTML='<section class="panel composer"><h2>Share something with your loop</h2><textarea id="postBody" class="field" placeholder="What’s happening? Share a thought..."></textarea><div class="row between"><label class="muted">Add photo or video <input id="postFile" type="file" accept="image/*,video/*" hidden></label><button onclick="$(\'postFile\').click()">＋ Gallery</button><button class="primary" id="publish">Publish post</button></div><div id="preview" class="muted"></div></section><h2>Latest posts <button id="refresh" style="float:right">↻ Refresh</button></h2><div id="feedList"></div>';let file=null;$('postFile').onchange=e=>{file=e.target.files[0];$('preview').textContent=file?.name||''};$('publish').onclick=async()=>{const body=$('postBody').value.trim();if(!body&&!file)return notice('Write something or choose a photo/video.');try{const {data,error}=await db.from('posts').insert({author_id:user.id,body,post_type:file?.type.startsWith('video/')?'short_video':'standard'}).select().single();if(error)throw error;if(file){const url=await upload(file,'posts');const {error:me}=await db.from('post_media').insert({post_id:data.id,owner_id:user.id,storage_path:url,media_type:file.type.startsWith('video/')?'video':'image',mime_type:file.type});if(me)throw me}$('postBody').value='';await loadFeed()}catch(e){notice('Could not publish: '+e.message)}};$('refresh').onclick=loadFeed;await loadFeed()}
else if(page==='profile'){await showProfile(me?.id)}
else if(page==='discover'){const {data,error}=await db.from('profiles').select('*').neq('id',user.id).limit(40);v.innerHTML='<section class="panel"><h2>Find your people</h2><input id="peopleSearch" class="field" placeholder="Search name or username"><div id="people" class="grid"></div></section>';if(error){$('people').textContent=error.message;return}const draw=rows=>$('people').innerHTML=rows.map(p=>'<div class="panel">'+avatar(p)+'<h3>'+esc(p.display_name)+'</h3><p class="muted">@'+esc(p.username)+'</p><button onclick="showProfile(\''+p.id+'\')">View profile</button><button onclick="follow(\''+p.id+'\')">Follow</button></div>').join('');draw(data||[]);$('peopleSearch').oninput=()=>draw((data||[]).filter(p=>(p.display_name+' '+p.username).toLowerCase().includes($('peopleSearch').value.toLowerCase())))}
else if(page==='reels'){const {data}=await db.from('posts').select('*,profiles!posts_author_id_fkey(*)').eq('post_type','short_video').is('deleted_at',null).order('created_at',{ascending:false}).limit(40);v.innerHTML='<h2>Short videos</h2>'+(data||[]).map(p=>'<article class="post"><b>'+esc(p.profiles?.display_name)+'</b><p>'+esc(p.body)+'</p><span class="muted">Video posts appear here as creators upload them.</span></article>').join('')||'<p class="muted">No videos yet. Share your first video from Home feed.</p>'}
else if(page==='communities'){v.innerHTML='<section class="panel"><h2>Communities</h2><p class="muted">Community groups, pages and events are being connected to the VYLOOP community database.</p></section>'}
else if(page==='market'){v.innerHTML='<section class="panel"><h2>Marketplace</h2><p class="muted">Browse products, seller profiles and listings. Marketplace listings and checkout are the next backend module.</p></section>'}
else if(page==='messages'){await renderWhatsApp(v)}
else if(page==='notifications'){const {data}=await db.from('notifications').select('*').eq('recipient_id',user.id).order('created_at',{ascending:false}).limit(50);v.innerHTML='<section class="panel"><h2>Notifications</h2>'+(data||[]).map(n=>'<p class="pill">'+esc(n.notification_type)+' · '+new Date(n.created_at).toLocaleString()+'</p>').join('')+'</section>'}
else if(page==='settings'){v.innerHTML='<section class="panel"><h2>Edit your profile</h2><label>Display name</label><input id="editName" class="field" value="'+esc(me?.display_name)+'"><label>Username</label><input id="editUser" class="field" value="'+esc(me?.username)+'"><label>Bio</label><textarea id="editBio" class="field">'+esc(me?.bio)+'</textarea><label>Profile picture from gallery</label><input id="avatarFile" type="file" accept="image/*" class="field"><label>Cover photo from gallery</label><input id="coverFile" type="file" accept="image/*" class="field"><label><input id="private" type="checkbox" '+(me?.is_private?'checked':'')+'> Private account</label><button class="primary" id="saveProfile">Save changes</button></section>';$('saveProfile').onclick=async()=>{try{let patch={display_name:$('editName').value,username:$('editUser').value,bio:$('editBio').value,is_private:$('private').checked};if($('avatarFile').files[0])patch.avatar_url=await upload($('avatarFile').files[0],'avatars');if($('coverFile').files[0])patch.cover_url=await upload($('coverFile').files[0],'covers');const {error}=await db.from('profiles').update(patch).eq('id',user.id);if(error)throw error;await loadMe();notice('Profile updated');go('profile')}catch(e){notice('Profile update failed: '+e.message)}}}
else if(page==='admin'){if(!adminRoles.length){v.innerHTML='';return}await adminHub()}
}
async function loadFeed(){const {data,error}=await db.from('posts').select('*,profiles!posts_author_id_fkey(id,username,display_name,avatar_url,is_verified),post_media(storage_path,media_type)').is('deleted_at',null).eq('visibility','public').order('created_at',{ascending:false}).limit(40);const el=$('feedList');if(!el)return;if(error){el.textContent=error.message;return}posts=data||[];el.innerHTML=posts.map(p=>'<article class="post"><div class="row">'+avatar(p.profiles)+'<div><b class="clickname" onclick="showProfile(\''+p.author_id+'\')">'+esc(p.profiles?.display_name||'Member')+'</b><div class="muted">@'+esc(p.profiles?.username)+' · '+new Date(p.created_at).toLocaleString()+'</div></div></div><p>'+esc(p.body)+'</p>'+(p.post_media||[]).map(m=>m.media_type==='video'?'<video class="postmedia" controls src="'+esc(m.storage_path)+'"></video>':'<img class="postmedia" src="'+esc(m.storage_path)+'">').join('')+'<div class="actions"><button onclick="react(\''+p.id+'\')">♡ Like</button><button onclick="comment(\''+p.id+'\')">Comment</button><button onclick="savePost(\''+p.id+'\')">☆ Save</button><button onclick="report(\'post\',\''+p.id+'\')">Report</button></div><div id="comments-'+p.id+'"></div></article>').join('')||'<section class="panel muted">Your feed is waiting for its first post. Be the first to share.</section>'}
async function react(id){const {error}=await db.from('reactions').upsert({user_id:user.id,post_id:id,reaction_type:'like'});if(error)notice(error.message);else notice('Liked')}
async function comment(id){const body=prompt('Write a comment');if(!body)return;const {error}=await db.from('comments').insert({post_id:id,author_id:user.id,body});if(error)notice(error.message);else notice('Comment added')}
async function savePost(id){const {error}=await db.from('saved_posts').upsert({user_id:user.id,post_id:id});notice(error?error.message:'Post saved')}
async function follow(id){const {error}=await db.from('follows').upsert({follower_id:user.id,following_id:id});notice(error?error.message:'Following')}
async function report(type,id){const reason=prompt('Why are you reporting this?');if(!reason)return;const {error}=await db.from('reports').insert({reporter_id:user.id,target_type:type,target_id:id,reason});notice(error?error.message:'Report sent')}
async function showProfile(id){const {data:p,error}=await db.from('profiles').select('*').eq('id',id).maybeSingle();if(error||!p)return notice(error?.message||'Profile unavailable');selectedProfile=p;page='profile';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='profile'));$('pageTitle').textContent=p.display_name||'Profile';const {data:posts}=await db.from('posts').select('*,post_media(storage_path,media_type)').eq('author_id',id).is('deleted_at',null).order('created_at',{ascending:false}).limit(30);const [{count:followers},{count:following}]=await Promise.all([db.from('follows').select('*',{count:'exact',head:true}).eq('following_id',id),db.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',id)]);$('view').innerHTML='<section class="panel"><div class="profilecover">'+(p.cover_url?'<img src="'+esc(p.cover_url)+'">':'')+'</div><div class="profilehead">'+avatar(p)+'</div><h2>'+esc(p.display_name)+'</h2><p class="muted">@'+esc(p.username)+'</p><p>'+esc(p.bio)+'</p><div class="row"><b>'+followers+'</b><span class="muted">followers</span><b>'+following+'</b><span class="muted">following</span></div><div class="actions">'+(id!==user.id?'<button class="primary" onclick="follow(\''+id+'\')">Follow</button><button onclick="startChat(\''+id+'\')">Message</button>':'<button onclick="go(\'settings\')">Edit profile</button>')+'</div></section><h2>Posts & videos</h2><div class="grid">'+(posts||[]).map(x=>'<article class="post"><p>'+esc(x.body)+'</p>'+(x.post_media||[]).map(m=>'<img class="postmedia" src="'+esc(m.storage_path)+'">').join('')+'</article>').join('')+'</div>'}
async function startChat(id){notice('Messaging UI is queued for the next build step.')}
async function adminHub(){const role=adminRoles.includes('super_admin')?'Super Administrator':adminRoles.join(', ');const [{count:users},{count:postCount},{count:reports},{count:following}]=await Promise.all([db.from('profiles').select('*',{count:'exact',head:true}),db.from('posts').select('*',{count:'exact',head:true}),db.from('reports').select('*',{count:'exact',head:true}).eq('status','open'),db.from('follows').select('*',{count:'exact',head:true})]);$('view').innerHTML='<section class="panel"><div class="row between"><div><div class="tag">RESTRICTED · AUTHORISED STAFF</div><h2>VYLOOP Control Centre</h2><p class="muted">'+esc(role)+'</p></div><span class="pill">Secure admin session</span></div><div class="grid"><div class="panel"><div class="muted">Members</div><div class="stat">'+(users??'—')+'</div></div><div class="panel"><div class="muted">Posts</div><div class="stat">'+(postCount??'—')+'</div></div><div class="panel"><div class="muted">Open reports</div><div class="stat">'+(reports??'—')+'</div></div></div></section><div class="adminwrap"><aside class="adminnav"><button data-admin="overview" class="active">▦ Overview</button><button data-admin="users">♙ Users</button><button data-admin="content">▤ Content</button><button data-admin="reports">⚑ Reports</button><button data-admin="followers">♡ Followers</button><button data-admin="bots">◉ Bot accounts</button><button data-admin="communities">♧ Communities</button><button data-admin="market">▣ Marketplace</button><button data-admin="team">♜ Admin team</button><button data-admin="audit">☷ Audit logs</button><button data-admin="settings">⚙ Platform settings</button></aside><div id="adminContent" class="admincontent panel"><h2>Platform at a glance</h2><p class="muted">Choose a section to manage VYLOOP. Every privileged action must be enforced by database policies and recorded.</p></div></div>';$('view').querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>adminSection(b.dataset.admin))}
async function adminSection(key){document.querySelectorAll('[data-admin]').forEach(b=>b.classList.toggle('active',b.dataset.admin===key));const c=$('adminContent');if(key==='users'||key==='followers'||key==='bots'){const {data,error}=await db.from('profiles').select('*').order('created_at',{ascending:false}).limit(100);c.innerHTML='<h2>'+({users:'Member management',followers:'Follower network',bots:'Bot & test accounts'}[key])+'</h2><p class="muted">Follower counts are derived from real follow relationships. Bot accounts should be clearly labelled test/service accounts, never fake engagement.</p>'+(error?esc(error.message):(data||[]).map(p=>'<div class="row between" style="padding:12px 0;border-bottom:1px solid var(--line)">'+avatar(p)+'<div style="flex:1"><b>'+esc(p.display_name)+'</b><div class="muted">@'+esc(p.username)+'</div></div><button onclick="showProfile(\''+p.id+'\')">View</button></div>').join(''))}
else if(key==='reports'){const {data,error}=await db.from('reports').select('*').order('created_at',{ascending:false}).limit(100);c.innerHTML='<h2>Reports queue</h2>'+(error?esc(error.message):(data||[]).map(r=>'<div class="post"><b>'+esc(r.target_type)+' report · '+esc(r.reason)+'</b><p class="muted">'+esc(r.details||'No extra details')+' · '+esc(r.status)+'</p><button onclick="resolveReport(\''+r.id+'\')">Mark resolved</button></div>').join('')||'<p class="muted">No reports found.</p>')}
else if(key==='content'){const {data}=await db.from('posts').select('id,body,created_at,author_id').order('created_at',{ascending:false}).limit(60);c.innerHTML='<h2>Content review</h2>'+(data||[]).map(p=>'<div class="post"><p>'+esc(p.body)+'</p><span class="muted">'+p.id+'</span><button onclick="moderatePost(\''+p.id+'\')">Remove post</button></div>').join('')}
else c.innerHTML='<h2>'+esc(key[0].toUpperCase()+key.slice(1))+'</h2><p class="muted">This module is being wired to its dedicated data tables and permission checks. No fake controls are shown as operational.</p>'}
async function resolveReport(id){const {error}=await db.from('reports').update({status:'resolved',reviewed_at:new Date().toISOString()}).eq('id',id);notice(error?error.message:'Report updated');adminSection('reports')}
async function moderatePost(id){const reason=prompt('Reason for removal');if(!reason)return;const {error}=await db.from('posts').update({deleted_at:new Date().toISOString()}).eq('id',id);if(error)notice(error.message);else{await db.from('moderation_actions').insert({moderator_id:user.id,target_type:'post',target_id:id,action:'remove_content',reason});notice('Post removed');adminSection('content')}}
async function authMode(signup){$('signupFields').classList.toggle('hidden',!signup);$('authTitle').textContent=signup?'Create your VYLOOP account':'Welcome back';$('authGo').textContent=signup?'Create account':'Log in';$('authSwitch').textContent=signup?'I already have an account':'Create account';$('authSwitch').onclick=()=>authMode(!signup);$('authGo').onclick=async()=>{const email=$('email').value,password=$('password').value;if(signup){const dob=$('dob').value;if(!dob)return $('authMsg').textContent='Date of birth is required.';const age=(Date.now()-new Date(dob).getTime())/31557600000;if(age<18)return $('authMsg').textContent='VYLOOP is 18+ only.';const {error}=await db.auth.signUp({email,password,options:{data:{display_name:$('display').value,username:$('username').value,date_of_birth:dob}}});$('authMsg').textContent=error?.message||'Check your email to confirm your account.'}else{const {error}=await db.auth.signInWithPassword({email,password});$('authMsg').textContent=error?.message||'Signing in…'}}}
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session){authMode(false);return}user=session.user;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await loadMe();go('feed');db.auth.onAuthStateChange((_e,s)=>{if(!s)location.reload()})}boot();
</script><script src="/chat.js"></script></body></html>
